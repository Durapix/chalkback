[project]
name = "chalkback-api"
version = "0.1.0"
description = "Chalkback backend: whiteboard reconstruction, lesson summaries and student reminders"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "python-multipart>=0.0.9",
    "anthropic>=0.60",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "pillow>=10.4",
    "pypdfium2>=4.30",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "resend>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"app/notify.py" = ["E501"]  # inline-styled email HTML
