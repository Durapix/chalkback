# Publishes a GitHub release for every vX.Y.Z tag, using that version's CHANGELOG section.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version]" '
            index($0, head) == 1 { on = 1; next }
            on && /^## / { exit }
            /^\[[^]]*\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "Release $GITHUB_REF_NAME" > notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
