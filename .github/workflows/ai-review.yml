# The agent reviews its own pull requests. GitHub does not let a PR author approve their own
# PR, so the review is posted as comments; the agent then pushes fixes and merges once CI is
# green and no blocking findings remain.
name: AI review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    # Needs the ANTHROPIC_API_KEY secret; turn on with the repository variable AI_REVIEW_ENABLED=true.
    if: ${{ vars.AI_REVIEW_ENABLED == 'true' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Focus on correctness bugs, security (auth checks, data leaks between teachers and
            students, secrets), and privacy of student data. Skip style nits that ruff/tsc catch.
            Post inline comments for concrete findings and one summary comment that ends with
            either "Verdict: ready to merge" or "Verdict: changes needed".
          claude_args: "--max-turns 30"
