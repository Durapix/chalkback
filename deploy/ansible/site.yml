# Provision the server and deploy Chalkback. Safe to run again; `--tags app` only deploys.
- name: Chalkback server
  hosts: chalkback
  become: true
  vars:
    app_dir: /opt/chalkback
    chalkback_ref: main
    deploy_user: deploy
    backup_dir: /opt/chalkback/backups
    backup_keep_days: 14
    deploy_public_key: "{{ lookup('file', '/ssh/key.pub') }}"
  roles:
    - { role: base, tags: [base] }
    - { role: ssh, tags: [ssh] }
    - { role: firewall, tags: [firewall] }
    - { role: docker, tags: [docker] }
    - { role: app, tags: [app] }
    - { role: backup, tags: [backup] }
