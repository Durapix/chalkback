# sshd keeps the first value it reads and drop-ins are read in order, so a 00- file wins over
# cloud-init's 50-cloud-init.conf ("PasswordAuthentication yes").
- name: SSH accepts keys only
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-chalkback.conf
    mode: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh
