- name: Docker's apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg

- name: Docker Engine and Compose
  ansible.builtin.apt:
    update_cache: true
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present

- name: Docker is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Deploy user (runs the stack; for CI deploys over SSH)
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    groups: docker
    append: true
    shell: /bin/bash

- name: Deploy user's SSH key
  ansible.posix.authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ deploy_public_key }}"
